name: EPA Onton weighting regression

on:
  pull_request:
    paths:
      - "epa/**"
      - "tests/**"
      - ".github/workflows/epa-onton-regression.yml"
  push:
    paths:
      - "epa/**"
      - "tests/**"
      - ".github/workflows/epa-onton-regression.yml"

permissions:
  contents: read

concurrency:
  group: epa-onton-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onton-weighting:
    name: Onton weighting / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify mode weighting without state mutation
        run: python -m pytest -q tests/test_assembler_weighting.py
